[app]
name = "Kayade Manager Pro"
version = "1.0.0"
env = "development"
url = "http://localhost/pressing_manager/"

[database]
host = "localhost"
dbname = "pressing_manager"
username = "root"
password = ""
charset = "utf8mb4"

[security]
max_login_attempts = "5"
lockout_time = "15"
session_lifetime = "3600"
csrf_enabled = "1"

[agency]
default_code_agence = "AG001"
currency = "FCFA"

