[app]
; Informations générales de l'application
name = "Pressing Manager Pro"
version = "1.0.0"
env = "development" ; changez en "production" lors du déploiement
url = "http://localhost/pressing_manager/"

[database]
; Paramètres de connexion MySQL
host = "localhost"
dbname = "pressing_manager"
username = "root"
password = ""
charset = "utf8mb4"

[security]
; Paramètres de sécurité
max_login_attempts = 5
lockout_time = 15 ; en minutes
session_lifetime = 3600 ; en secondes
csrf_enabled = true

[agency]
; Configuration par défaut de l'agence principale
default_code_agence = "AG001"
currency = "FCFA"